<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FBF3E4">
<title>เบื้องหลังพิพิธภัณฑ์เด็ก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout idea: one portrait "phone stage", hand-drawn gouache scenes from the real museum (pink/blue mats, orange hippo tunnel, green floor circle), paper grain over everything */
:root{
  --paper:#FBF3E4;
  --ink:#2E2A3B;
  --pink:#EF7BA6;
  --blue:#4A7FD1;
  --orange:#F2742B;
  --green:#4AA65A;
  --yellow:#F6C445;
  --teal:#2DAFA4;
  --dusk:#3B3358;
  --f-display:"Mali","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#E9DFCC;font-family:var(--f-body);color:var(--ink);overflow:hidden;
  background-image:radial-gradient(circle at 20% 10%,#F3E9D6 0,transparent 50%),radial-gradient(circle at 80% 90%,#E2D4BC 0,transparent 55%)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--paper);overflow:hidden;
  box-shadow:0 0 0 1px rgba(46,42,59,.08),0 30px 80px rgba(46,42,59,.18);user-select:none;-webkit-user-select:none}
.grain{position:absolute;inset:0;pointer-events:none;z-index:50;mix-blend-mode:multiply;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease}
.scene.on{opacity:1}
svg.art{display:block;width:100%;height:100%}
.ink{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ink2{stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
.clock{font-family:var(--f-display);font-weight:700;font-size:15px;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 12px 3px 8px;display:flex;align-items:center;gap:6px;box-shadow:2px 3px 0 var(--ink);
  font-variant-numeric:tabular-nums;transition:opacity .4s}
.clock i{width:14px;height:14px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:block}
.clock.night i{background:#C9C3F0}
.dots{display:flex;gap:6px;flex:1}
.dots b{height:7px;flex:1;max-width:46px;border-radius:9px;background:rgba(46,42,59,.14);border:1.5px solid rgba(46,42,59,.25);transition:background .4s}
.dots b.done{background:var(--teal);border-color:var(--ink)}
.dots b.now{background:var(--yellow);border-color:var(--ink)}
.iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);
  box-shadow:2px 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.hud.hide .clock,.hud.hide .dots{opacity:0}

/* text */
.title{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
.task{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:20;
  background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px 11px;box-shadow:3px 4px 0 var(--ink);
  display:flex;gap:12px;align-items:center}
.task .tag{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.02em;color:#fff;background:var(--ink);
  padding:2px 8px;border-radius:7px;white-space:nowrap;align-self:flex-start;margin-top:2px}
.task p{margin:0;font-size:16px;line-height:1.4;font-weight:500}
.task small{display:block;font-size:13px;opacity:.7;font-weight:400;margin-top:1px}
.count{font-family:var(--f-display);font-weight:700;font-size:20px;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);
  border-radius:16px;padding:13px 26px;box-shadow:3px 5px 0 var(--ink);cursor:pointer;transition:transform .08s}
.btn:active{transform:translate(3px,5px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:#fff;font-size:16px;padding:10px 18px}
.btn:focus-visible,.iconbtn:focus-visible,.skip:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.skip{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;font-family:var(--f-body);font-size:13px;
  background:rgba(255,255,255,.85);border:2px solid rgba(46,42,59,.4);border-radius:999px;padding:5px 12px;color:var(--ink);cursor:pointer}
.toast{position:absolute;left:50%;z-index:35;transform:translate(-50%,0) scale(.8);opacity:0;pointer-events:none;
  font-family:var(--f-display);font-weight:700;font-size:17px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;
  padding:6px 14px;box-shadow:2px 3px 0 var(--ink);white-space:nowrap;transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.toast.show{opacity:1;transform:translate(-50%,-14px) scale(1)}

/* card / narration */
.narr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:40px 28px;gap:18px;z-index:10}
.narr .time{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.narr .line{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.45;opacity:0;transform:translateY(8px);transition:all .7s ease}
.narr .line.in{opacity:1;transform:none}
.tapnext{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:0;right:0;text-align:center;font-size:14px;opacity:.6;
  animation:breathe 1.8s ease-in-out infinite;z-index:12}
@keyframes breathe{50%{opacity:.25}}

/* ID card */
.idcard{width:min(300px,82%);background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 6px 0 var(--ink);
  overflow:hidden;text-align:left;transform:rotate(-2deg)}
.idcard .top{background:var(--teal);color:#fff;padding:9px 14px;font-family:var(--f-display);font-weight:700;font-size:14px;
  display:flex;justify-content:space-between;border-bottom:3px solid var(--ink)}
.idcard .body{display:flex;gap:12px;padding:14px}
.idcard .ph{width:64px;height:76px;border:2.5px solid var(--ink);border-radius:10px;background:#FDE9C9;flex:none;overflow:hidden}
.idcard label{font-size:12px;opacity:.65;display:block}
.idcard input{width:100%;font-family:var(--f-display);font-size:20px;font-weight:700;border:none;border-bottom:2.5px dashed var(--ink);
  background:transparent;padding:2px 0;color:var(--ink);outline:none;border-radius:0}
.idcard .role{font-size:13px;margin-top:8px}
.lanyard{width:16px;height:60px;background:var(--orange);border:2.5px solid var(--ink);border-bottom:none;margin:0 auto -4px}

/* dialog bubble */
.bubble{position:absolute;z-index:22;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:9px 14px;
  font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.4;box-shadow:2px 3px 0 var(--ink);max-width:78%;
  transform-origin:bottom center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bubble:after{content:"";position:absolute;bottom:-11px;left:var(--tail,50%);width:16px;height:16px;background:#fff;
  border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* crayons */
.tray{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);display:flex;justify-content:center;gap:12px;z-index:21}
.crayon{width:42px;height:118px;touch-action:none;cursor:grab;filter:drop-shadow(2px 3px 0 rgba(46,42,59,.9))}
.crayon.drag{position:fixed;z-index:60;pointer-events:none;transform:rotate(-15deg) scale(1.1)}
.palette{display:flex;gap:10px;justify-content:center;padding:10px 0}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.sw.sel{transform:translateY(-6px);box-shadow:2px 8px 0 var(--ink)}
.paperwrap{position:relative;margin:0 auto;border:3px solid var(--ink);border-radius:6px;background:#fff;box-shadow:4px 6px 0 var(--ink);
  transform:rotate(-1.2deg);touch-action:none}
.paperwrap canvas{position:absolute;inset:0;width:100%;height:100%}

/* reveal */
.rcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:70px 24px 90px;text-align:center}
.rcard .pic{width:min(300px,80vw);aspect-ratio:1;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;box-shadow:4px 6px 0 var(--ink);position:relative}
.rcard .cap{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.5;max-width:30ch}
.rcard .cap em{font-style:normal;background:linear-gradient(transparent 60%,rgba(246,196,69,.7) 60%)}
.rcard .sub{font-size:15px;opacity:.7;margin-top:-6px}
.note{position:absolute;font-family:var(--f-display);font-weight:600;color:#C2416F;font-size:22px;line-height:1.3;transform:rotate(-6deg);
  background:#FFF4B8;border:2.5px solid var(--ink);padding:10px 14px;box-shadow:3px 4px 0 var(--ink);opacity:0;transition:all .8s cubic-bezier(.3,1.4,.5,1)}
.note.in{opacity:1}
.sticky{background:#FFF1A8;border:2.5px solid var(--ink);box-shadow:3px 5px 0 var(--ink);padding:18px 18px 16px;width:min(300px,82vw);
  text-align:left;font-family:var(--f-display);font-size:18px;line-height:1.55;transform:rotate(1.5deg);position:relative}
.sticky:before{content:"";position:absolute;top:-14px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(239,123,166,.55);transform:rotate(-3deg)}
.sticky .from{text-align:right;font-size:15px;margin-top:8px;opacity:.75}

/* final */
.final{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 30px);
  display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.wall{position:relative;width:100%;max-width:400px;height:330px;flex:none}
.polaroid{position:absolute;background:#fff;padding:7px 7px 26px;border:2px solid var(--ink);box-shadow:3px 4px 0 rgba(46,42,59,.85);width:46%}
.polaroid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(1.05) contrast(1.02)}
.polaroid span{position:absolute;bottom:4px;left:0;right:0;font-family:var(--f-display);font-size:13px;font-weight:600}
.final p{margin:0;line-height:1.6;max-width:34ch}
.credit{font-size:12px;opacity:.55}
.modal{position:absolute;inset:0;z-index:45;background:rgba(46,42,59,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:100%;background:var(--paper);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  display:flex;flex-direction:column;gap:12px;animation:up .35s ease}
@keyframes up{from{transform:translateY(100%)}}
.sheet textarea{font-family:var(--f-display);font-size:19px;line-height:1.5;border:2.5px solid var(--ink);border-radius:14px;padding:12px;min-height:120px;
  background:#FFF6C4;color:var(--ink);resize:none;outline:none}
.board{width:100%;max-width:400px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.board .mini{background:#FFF1A8;border:2px solid var(--ink);padding:8px 10px;font-family:var(--f-display);font-size:15px;max-width:180px;box-shadow:2px 3px 0 var(--ink);text-align:left}
.heart{position:absolute;z-index:46;pointer-events:none;animation:floatup 1.6s ease-out forwards}
@keyframes floatup{to{transform:translate(var(--dx),-260px) scale(.4) rotate(var(--r));opacity:0}}
.hand{position:absolute;width:56px;height:56px;pointer-events:none;z-index:25}
.spark{position:absolute;pointer-events:none;z-index:26;width:10px;height:10px;margin:-5px;background:var(--yellow);border:2px solid var(--ink);border-radius:2px;
  animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}
/* coach (พี่หญิง) */
.coach{position:absolute;left:12px;right:96px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:31;display:flex;align-items:flex-end;gap:8px;
  pointer-events:none;opacity:0;transform:translateY(18px);transition:all .45s cubic-bezier(.3,1.4,.5,1)}
.coach.top{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 142px)}
.coach.on{opacity:1;transform:none}
.cav{width:62px;height:62px;flex:none;border-radius:50%;background:#FFF0B8;border:2.5px solid var(--ink);overflow:hidden;box-shadow:2px 3px 0 var(--ink)}
.cb{background:#fff;border:2.5px solid var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px 8px;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.4;box-shadow:2px 3px 0 var(--ink)}
.cb b{display:block;font-size:12px;color:#B07D00}
/* cartoon -> real photo */
.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(10px) sepia(.9) brightness(1.3);transform:scale(1.06);transition:opacity 1.8s ease,filter 2.4s ease,transform 2.4s ease}
.real.in{opacity:1;filter:none;transform:none}
.realtag{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12px;font-weight:600;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;
  opacity:0;transform:translateY(6px);transition:all .6s ease 1.4s}
.realtag.in{opacity:1;transform:none}
.quote{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.5;max-width:28ch;position:relative;padding:0 10px}
.quote:before{content:"\201C";position:absolute;left:-14px;top:-18px;font-size:56px;color:var(--orange);line-height:1}
.choice{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
      <radialGradient id="ballShine" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
  </svg>

  <div class="hud hide" id="hud">
    <div class="clock" id="clock"><i></i><span id="clockT">07:30</span></div>
    <div class="dots" id="dots"><b></b><b></b><b></b></div>
    <button class="iconbtn" id="mute" aria-label="ปิดเสียง">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E2A3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#F6C445"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </div>
  <div id="stage"></div>
  <div class="grain"></div>
</div>

<script>
(()=>{
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage'), hud=$('#hud');
const NS='http://www.w3.org/2000/svg';
const S={name:'',drawing:null};
const C={ink:'#2E2A3B',pink:'#EF7BA6',blue:'#4A7FD1',orange:'#F2742B',green:'#4AA65A',yellow:'#F6C445',teal:'#2DAFA4',red:'#E5484D',purple:'#8A63C9'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------------- audio ---------------- */
const A={ctx:null,master:null,muted:false,musicOn:false,step:0,next:0,tempo:96,mood:'day',timer:null};
function audioInit(){
  if(A.ctx)return;
  try{
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    A.master=A.ctx.createGain();A.master.gain.value=.9;A.master.connect(A.ctx.destination);
    A.music=A.ctx.createGain();A.music.gain.value=.0;A.music.connect(A.master);
    A.lp=A.ctx.createBiquadFilter();A.lp.type='lowpass';A.lp.frequency.value=5000;A.lp.connect(A.music);
    const len=A.ctx.sampleRate*2,b=A.ctx.createBuffer(1,len,A.ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=b;
  }catch(e){A.ctx=null}
}
function tone(f,t,dur,vol,type='sine',dest){
  if(!A.ctx)return;const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||A.master);o.start(t);o.stop(t+dur+.05);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  pop(p=0){if(!A.ctx)return;const t=A.ctx.currentTime;tone(mtof(72+p),t,.18,.18,'triangle');tone(mtof(79+p),t+.04,.14,.08,'sine')},
  plop(i=0){if(!A.ctx)return;const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();
    o.frequency.setValueAtTime(mtof(67+[0,2,4,7,9,12,14][i%7]),t);o.frequency.exponentialRampToValueAtTime(mtof(55+[0,2,4,7,9,12,14][i%7]),t+.15);
    g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+.25)},
  sparkle(){if(!A.ctx)return;const t=A.ctx.currentTime;[84,88,91,96].forEach((m,i)=>tone(mtof(m),t+i*.06,.4,.07,'sine'))},
  chime(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(mtof(76),t,1.2,.16,'sine');tone(mtof(72),t+.45,1.4,.16,'sine')},
  soft(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(220,t,.12,.06,'sine')},
  click(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(1200,t,.03,.08,'square');tone(90,t+.02,.25,.12,'sine')},
  win(){if(!A.ctx)return;const t=A.ctx.currentTime;[72,76,79,84].forEach((m,i)=>{tone(mtof(m),t+i*.09,.5,.1,'triangle')})},
  sob(){if(!A.ctx)return;const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(380,t+.35);g.gain.setValueAtTime(.0,t);g.gain.linearRampToValueAtTime(.05,t+.05);g.gain.linearRampToValueAtTime(0,t+.4);
    o.connect(g);g.connect(A.master);o.start(t);o.stop(t+.45)}
};
let squeak=null;
function squeakStart(){if(!A.ctx||squeak)return;const s=A.ctx.createBufferSource();s.buffer=A.noise;s.loop=true;
  const f=A.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=2.5;const g=A.ctx.createGain();g.gain.value=0;
  s.connect(f);f.connect(g);g.connect(A.master);s.start();squeak={s,f,g}}
function squeakSet(v){if(!squeak)return;const t=A.ctx.currentTime;squeak.g.gain.setTargetAtTime(Math.min(.09,v),t,.04);squeak.f.frequency.setTargetAtTime(1800+v*9000,t,.05)}
function squeakStop(){if(!squeak)return;const q=squeak;squeak=null;q.g.gain.setTargetAtTime(0,A.ctx.currentTime,.05);setTimeout(()=>{try{q.s.stop()}catch(e){}},300)}

/* music box: I–vi–IV–V arpeggios in C, gentle */
const PROG=[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
const MEL=[76,null,79,null,77,76,74,null,72,null,74,76,null,74,72,null, 69,null,72,null,74,null,76,null,74,72,null,69,67,null,null,null];
function musicStart(){if(!A.ctx||A.musicOn)return;A.musicOn=true;A.next=A.ctx.currentTime+.1;A.music.gain.setTargetAtTime(.55,A.ctx.currentTime,1);
  A.timer=setInterval(()=>{while(A.next<A.ctx.currentTime+.15){schedule(A.step,A.next);A.next+=60/A.tempo/2;A.step++}},30)}
function schedule(step,t){
  const bar=Math.floor(step/8)%4,ch=PROG[bar],i=step%8;
  const arp=[0,1,2,3,2,1,2,1][i];const night=A.mood==='night';
  tone(mtof(ch[arp]+(night?-12:0)),t,night?1.4:.9,.05,'triangle',A.lp);
  if(i===0)tone(mtof(ch[0]-12),t,1.8,.06,'sine',A.lp);
  const m=MEL[step%32];if(m&&!night)tone(mtof(m),t,1.1,.045,'sine',A.lp);
  if(m&&night&&step%2===0)tone(mtof(m-12),t,1.6,.035,'sine',A.lp);
}
function setMood(m){A.mood=m;if(!A.ctx)return;A.tempo=m==='night'?72:m==='warm'?84:96;A.lp.frequency.setTargetAtTime(m==='night'?1400:m==='warm'?3000:5000,A.ctx.currentTime,1)}

  function crayon(a,b){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/1.6));cx.fillStyle=cur;
    for(let i=0;i<n;i++){const t=i/n,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;for(let k=0;k<5;k++){cx.globalAlpha=rnd(.18,.45);cx.fillRect(x+rnd(-7,7),y+rnd(-7,7),rnd(1.5,3.5),rnd(1.5,3.5))}}

    {html:`<div class="sticky">ขอบคุณพี่ๆ ที่ดูแลน้องมิววันนี้นะคะ<br>กลับถึงบ้านน้องเล่าไม่หยุดเลย<br>ถามแม่ว่าเสาร์หน้ามาอีกได้ไหม<div class="from">— แม่น้องมิว</div></div>
      <div class="cap" style="margin-top:14px">คำขอบคุณแบบนี้<br>คือ <em>ค่าตอบแทน</em> ที่พี่ๆ ได้รับ</div>`},
    {pause:1,html:`<div class="sub" style="opacity:.75;font-size:16px;margin:0">พี่หญิงที่สอนงานคุณวันนี้…</div>
      <div class="pic" style="width:min(250px,66vw)">${revealYingArt()}<img class="real" src="img/ying.jpg" alt="พี่หญิง เจ้าหน้าที่พิพิธภัณฑ์"><span class="realtag">ภาพจริง · พี่หญิง</span></div>
      <div class="quote">รอยยิ้มของเด็กๆ ที่มานี่แหละ<br>ทำให้พี่ยังมีแรงทำต่อ</div>
      <div class="sub" style="margin-top:0">พี่หญิง · ดูแลเด็กๆ ที่นี่มา <b>20 ปี</b></div>`,real:1},
    {html:`<div class="sub" style="opacity:.75;font-size:16px;margin:0">10 ปีต่อมา</div>
      <div class="pic" style="aspect-ratio:4/3;width:min(330px,86vw)">${revealGrownArt()}<img class="real" src="img/group.jpg" alt="ทีมผู้สร้างเกมกับพี่หญิงในวันที่กลับมา"><span class="realtag">ภาพจริง · วันที่กลับมา</span></div>
      <div class="cap">มิวกลับมาที่นี่อีกครั้ง<br>และ <em>พี่หญิงยังอยู่ที่เดิม</em></div>
      <div class="sub" style="max-width:32ch;line-height:1.55">เรื่องนี้มาจากเรื่องจริง หนึ่งในทีมผู้สร้างเกมเคยมาที่นี่ตอนเด็กเมื่อ 10 ปีก่อน วันที่กลับมา พี่หญิงยังคอยดูแลเด็กๆ อยู่ตรงนี้</div>`,real:1},
    {html:S.child?`<div class="cap" style="font-size:19px;opacity:.75">แล้วคุณล่ะ</div>
      <div class="title" style="font-size:28px;max-width:13em">ตอนเด็ก ที่คุณวิ่งเข้าไปเล่น<br>ในที่แบบนี้</div>
      <div class="cap">วันนั้น ก็มีพี่สักคน<br><em>เช็ดของเล่นให้คุณ</em> ก่อนคุณมาถึง</div><div class="sub">แค่คุณไม่เคยเห็นเขา</div>`
     :`<div class="cap" style="font-size:19px;opacity:.75">แล้วคุณล่ะ</div>
      <div class="title" style="font-size:28px;max-width:13em">ถึงจะจำไม่ได้แล้ว</div>
      <div class="cap">ทุกที่ที่เด็กๆ ได้เล่นอย่างปลอดภัย<br><em>มีพี่สักคนเตรียมไว้ให้ก่อนเสมอ</em></div><div class="sub">รวมถึงวันที่คุณยังเด็กด้วย</div>`}
  ];
  let i=0,busy=false;const wrap=el('div',{style:'position:absolute;inset:0'});sc.appendChild(wrap);
  const tap=el('div',{class:'tapnext'},'แตะเพื่อดูต่อ');sc.appendChild(tap);
  const dotsW=el('div',{style:'position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:5'});
  cards.forEach(()=>dotsW.appendChild(el('b',{style:'width:22px;height:5px;border-radius:5px;background:rgba(46,42,59,.18);display:block'})));sc.appendChild(dotsW);
  async function show(){
    busy=true;const cd=cards[i];
    if(cd.pause){wrap.innerHTML='';tap.style.opacity=0;musicTo(0,1);await sleep(2200);setMood('night');musicTo(.5,3);tap.style.opacity=''}
    const c=el('div',{class:'rcard',style:'opacity:0;transform:translateY(16px);transition:all .7s ease'},cd.html);wrap.innerHTML='';wrap.appendChild(c);
    [...dotsW.children].forEach((d,k)=>d.style.background=k<=i?'#2E2A3B':'rgba(46,42,59,.18)');
    requestAnimationFrame(()=>{c.style.opacity=1;c.style.transform='none'});
    if(i===0)musicTo(.5,2);
    SFX.sparkle();
    if(cd.real){await sleep(1500);c.querySelectorAll('.real,.realtag').forEach(x=>x.classList.add('in'));SFX.chime();buzz(10);await sleep(1600)}
    else if(cd.note){await sleep(1200);const n=$('#mn',c);if(n){n.classList.add('in');SFX.chime();buzz([10,60,10])}await sleep(500)}
    else{SFX.chime();await sleep(900)}
    busy=false;
  }
  show();
  sc.addEventListener('pointerup',()=>{if(busy)return;i++;if(i>=cards.length){go(sceneFinal);return}SFX.pop(i*2);show()});
}

/* ============== SCENE 11: final ============== */
function sceneFinal(sc){
  sc.style.background='var(--paper)';
  const ph=[['building','ศูนย์การเรียนรู้ฯ',2,4,-5],['ying','พี่หญิง · 20 ปี',50,0,4],['hall','ลานกิจกรรม',0,150,3],['playland','Kids Happy Land',52,166,-4]];
  sc.innerHTML=`<div class="final">
    <div style="font-size:13px;font-weight:600;letter-spacing:.08em;opacity:.6">เรื่องจริง ที่เกิดขึ้นทุกวัน</div>
    <h2 class="title" style="font-size:32px">พี่ๆ เจ้าหน้าที่<br>ทำแบบนี้ทุกวัน</h2>
    <div class="wall">${ph.map(([f,c,x,y,r])=>`<div class="polaroid" style="left:${x}%;top:${y}px;transform:rotate(${r}deg)"><img src="img/${f}.jpg" alt="${c}"><span>${c}</span></div>`).join('')}</div>
    <p style="font-size:17px">เช็ดของเล่นก่อนใครตื่น ตรวจทุกซอกมุมก่อนใครเห็น<br>ดูแลเด็กที่ไม่รู้จักเหมือนน้องของตัวเอง<br>แล้วเก็บทุกอย่างคืนที่เดิมหลังทุกคนกลับบ้าน</p>
    <p style="font-family:var(--f-display);font-size:20px;font-weight:600">ความสุขที่เด็กๆ ได้รับ<br>มีคนตั้งใจส่งต่อมาให้เสมอ</p>
    <p style="font-size:16px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:3px 4px 0 var(--ink)">ครั้งหน้าที่ไปพิพิธภัณฑ์ ห้องสมุด<br>หรือ<span style="white-space:nowrap">สวนสนุก</span> ลองพูดคำว่า <b>“ขอบคุณครับ/ค่ะ”</b> กับพี่สักคน<br><span style="opacity:.7">เขาอาจยังไม่ได้ยินคำนี้เลยทั้งวัน</span></p>
    <div style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%">
      <button class="btn" id="thank">เขียนคำขอบคุณถึงพี่ๆ</button>
      <div class="board" id="board"></div>
      <button class="btn alt" id="again">เล่นอีกครั้ง</button>
    </div>
    <div class="credit">ภาพถ่ายจริงจาก ศูนย์การเรียนรู้สำหรับครอบครัว (Bangkok Family Center)<br>พี่หญิงเป็นบุคคลจริง ใช้ภาพและคำพูดโดยได้รับอนุญาต · น้องมิวและเหตุการณ์ในเกมเป็นเรื่องสมมติ</div>
  </div>
  <div class="modal" id="modal"><form class="sheet" id="form">
    <div class="title" style="font-size:22px">ถึงพี่ๆ เจ้าหน้าที่</div>
    <label for="msg" style="font-size:14px;opacity:.7">เขียนสั้นๆ จากใจ แคปหน้าจอเก็บไว้ หรือเอาไปบอกพี่ๆ ด้วยตัวเอง</label>
    <textarea id="msg" maxlength="140" placeholder="ขอบคุณที่…"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn alt" id="cancel">ยกเลิก</button><button type="submit" class="btn">แปะบนบอร์ด</button></div>
  </form></div>`;
  const modal=$('#modal',sc);
  $('#thank',sc).addEventListener('click',()=>{modal.classList.add('on');SFX.pop();setTimeout(()=>$('#msg',sc).focus(),350)});
  $('#cancel',sc).addEventListener('click',()=>modal.classList.remove('on'));
  $('#form',sc).addEventListener('submit',e=>{e.preventDefault();const v=$('#msg',sc).value.trim();if(!v){$('#msg',sc).focus();return}
    modal.classList.remove('on');const n=el('div',{class:'mini'});n.textContent=v+(S.name?` — ${S.name}`:'');
    n.style.transform=`rotate(${rnd(-4,4)}deg)`;$('#board',sc).appendChild(n);$('#msg',sc).value='';SFX.win();buzz([10,40,10]);
    const r=n.getBoundingClientRect(),s=sc.getBoundingClientRect();
    for(let k=0;k<10;k++){const h=el('div',{class:'heart',style:`left:${r.left-s.left+r.width/2+rnd(-30,30)}px;top:${r.top-s.top}px;--dx:${rnd(-60,60)}px;--r:${rnd(-40,40)}deg;animation-delay:${k*60}ms`},
      `<svg width="26" height="24" viewBox="0 0 26 24"><path d="M13 22 C4 15 1 10 1 6.5 A5.5 5.5 0 0 1 13 4 A5.5 5.5 0 0 1 25 6.5 C25 10 22 15 13 22Z" fill="${[C.pink,C.red,C.yellow][k%3]}" stroke="#2E2A3B" stroke-width="2"/></svg>`);sc.appendChild(h);setTimeout(()=>h.remove(),1800)}
    $('#thank',sc).textContent='เขียนอีกใบ'});
  $('#again',sc).addEventListener('click',()=>{S.drawing=null;setMood('day');musicTo(.55,1);go(sceneTitle)});
}

go(sceneTitle);
})();
</script>
</body>
